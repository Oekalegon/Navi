name: Swift

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Checkout AstroKit (local dependency)
      uses: actions/checkout@v4
      with:
        repository: Oekalegon/AstroKit
        path: AstroKit

    - name: Checkout INDIMCPKit (local dependency)
      uses: actions/checkout@v4
      with:
        repository: Oekalegon/INDIMCPKit
        path: INDIMCPKit

    - name: Symlink AstroKit as sibling of Navi
      run: ln -s "$GITHUB_WORKSPACE/AstroKit" "$(dirname "$GITHUB_WORKSPACE")/AstroKit"

    - name: Symlink INDIMCPKit as sibling of Navi
      run: ln -s "$GITHUB_WORKSPACE/INDIMCPKit" "$(dirname "$GITHUB_WORKSPACE")/INDIMCPKit"

    - name: Install CFITSIO
      run: brew install cfitsio

    - name: Build
      run: xcodebuild -project Navi.xcodeproj -scheme Navi -destination 'platform=macOS' build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Run tests
      run: xcodebuild -project Navi.xcodeproj -scheme Navi -destination 'platform=macOS' test -skip-testing:NaviUITests CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
